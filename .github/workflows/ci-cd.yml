name: CI / CD & Docs Auto-Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build, Verify & Auto-Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Build Production Bundle
        run: npm run build

      - name: 📖 Verify README.md Integrity
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::README.md is missing!"
            exit 1
          fi
          echo "README.md size: $(wc -c < README.md) bytes"
          echo "README lines: $(wc -l < README.md)"

      - name: 🚀 Trigger Render Deploy (Optional Hook)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render webhook deploy..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy triggered successfully."

      - name: 📊 Post Deployment Summary
        run: |
          echo "### 🚀 Shizuku Web Auto-Deploy Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: \`${{ github.actor }}\` via \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Production URL**: [https://shizuku-web.onrender.com](https://shizuku-web.onrender.com)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Built & Verified Successfully ✅" >> $GITHUB_STEP_SUMMARY
